<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Tic Tac Toe</h1>

    <div class="mode-row">
      <span class="mode-label">2 Player</span>
      <label class="toggle-switch">
        <input type="checkbox" id="mode-toggle" />
        <span class="toggle-track"></span>
      </label>
      <span class="mode-label">vs AI</span>
    </div>

    <div class="difficulty-row" id="difficulty-row">
      <button class="diff-btn active" data-diff="easy">Easy</button>
      <button class="diff-btn" data-diff="hard">Hard</button>
    </div>

    <div class="scoreboard">
      <div class="score-card" id="score-x">
        <span class="player-label x">X</span>
        <span class="score" id="score-x-val">0</span>
      </div>
      <div class="score-card draws">
        <span class="player-label">Draws</span>
        <span class="score" id="score-draws">0</span>
      </div>
      <div class="score-card" id="score-o">
        <span class="player-label o">O</span>
        <span class="score" id="score-o-val">0</span>
      </div>
    </div>

    <div class="status" id="status">Player X's turn</div>

    <div class="board" id="board">
      <div class="cell" data-index="0"></div>
      <div class="cell" data-index="1"></div>
      <div class="cell" data-index="2"></div>
      <div class="cell" data-index="3"></div>
      <div class="cell" data-index="4"></div>
      <div class="cell" data-index="5"></div>
      <div class="cell" data-index="6"></div>
      <div class="cell" data-index="7"></div>
      <div class="cell" data-index="8"></div>
    </div>

    <div class="controls">
      <button id="reset-btn">New Game</button>
      <button id="clear-scores-btn">Clear Scores</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
